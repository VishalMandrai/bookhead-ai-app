[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# pytest configuration for BookLens AI
# ─────────────────────────────────────────────────────────────────────────────

# Root directory for test discovery
testpaths = tests

# Asyncio mode: "auto" means async test functions don't need @pytest.mark.asyncio
asyncio_mode = auto

# Show local variable values in tracebacks (helps debug failures)
showlocals = false

# Short traceback format for cleaner output
tb = short

# Always show extra test summary info for failures, errors, and warnings
addopts =
    -ra
    --strict-markers
    -q

# Custom markers (prevents "unknown mark" warnings)
markers =
    unit: Fast isolated unit tests (no IO, no network)
    integration: Tests that exercise the full HTTP stack via TestClient
    slow: Tests that are expected to take more than 1 second
