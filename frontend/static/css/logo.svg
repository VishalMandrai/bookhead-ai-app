<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="50 0 620 200">
  <defs>
    <style>
      .title {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 72px;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Book -->
  <g transform="translate(105 58) scale(0.45)">
    <!-- Cover -->
    <rect x="0" y="0" width="140" height="180" rx="10"
          fill="#f8f4e9"/>

    <!-- Spine -->
    <rect x="0" y="0" width="22" height="180"
          fill="#cfb11d"/>

    <!-- Pages -->
    <path d="M20 15
             Q80 0 135 15
             L135 30
             Q80 15 20 30 Z"
          fill="#000000"/>

    <!-- Bookmark -->
    <path d="M120 0
             L120 45
             L110 35
             L100 45
             L100 0"
          fill="#D89A1D"/>

    <!-- AI Brain -->
    <circle cx="78" cy="88" r="28"
            fill="none"
            stroke="#000000"
            stroke-width="4"/>

    <circle cx="66" cy="80" r="4" fill="#000000"/>
    <circle cx="90" cy="78" r="4" fill="#000000"/>
    <circle cx="78" cy="96" r="4" fill="#000000"/>
    <circle cx="60" cy="102" r="4" fill="#000000"/>
    <circle cx="95" cy="103" r="4" fill="#000000"/>

    <line x1="66" y1="80" x2="78" y2="96"
          stroke="#000000" stroke-width="3"/>
    <line x1="90" y1="78" x2="78" y2="96"
          stroke="#000000" stroke-width="3"/>
    <line x1="60" y1="102" x2="78" y2="96"
          stroke="#000000" stroke-width="3"/>
    <line x1="95" y1="103" x2="78" y2="96"
          stroke="#000000" stroke-width="3"/>
  </g>

  <!-- Text -->
  <text x="180" y="125" class="title" fill="#e9d1a5">
    BookHead
  </text>

  <text x="540" y="125" class="title" fill="#c8a96e">
    AI
  </text>
</svg>